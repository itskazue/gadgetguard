services:
  - type: web
    name: gadgetguard
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gadgetguard-db
          property: connectionString

databases:
  - name: gadgetguard-db
    plan: free
    databaseName: gadgetguard
    user: gadgetguard_user
